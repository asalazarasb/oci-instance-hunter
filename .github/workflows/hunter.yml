name: OCI A1 Capacity Hunter

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
      OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
      SUPPRESS_LABEL_WARNING: "True"
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

    steps:
      - name: Instalar OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configurar credenciales OCI
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY_FILE" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Validar conexion con OCI
        run: |
          oci iam compartment get --compartment-id "$OCI_TENANCY_OCID" --output table

      - name: Reintentar despliegue del Stack
        id: deploy
        run: |
          set +e
          SUCCESS="false"
          
          for i in {1..5}; do
            echo "=============================================="
            echo "[Intento $i/5] Creando Apply Job para el Stack..."
            
            OUTPUT=$(oci resource-manager job create-apply-job \
              --stack-id "$OCI_STACK_ID" \
              --execution-plan-strategy "AUTO_APPROVED" \
              --display-name "gh-action-retry-$(date +%s)" 2>&1)
            
            JOB_ID=$(echo "$OUTPUT" | grep -o 'ocid1.ormjob.oc1.[^" ]*' | head -n 1)

            if [ -z "$JOB_ID" ]; then
              echo "Aviso: No se generó Job ID. Esperando 90 segundos..."
              sleep 90
              continue
            fi

            echo "Job ID detectado: $JOB_ID. Monitoreando..."
            
            while true; do
              STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query "data.\"lifecycle-state\"" --raw-output 2>/dev/null)
              if [[ "$STATUS" == "SUCCEEDED" || "$STATUS" == "FAILED" || "$STATUS" == "CANCELED" ]]; then
                break
              fi
              sleep 5
            done

            echo "Resultado final del job: $STATUS"

            if [ "$STATUS" == "SUCCEEDED" ]; then
              echo "¡Instancia creada con exito!"
              SUCCESS="true"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Sin capacidad. Esperando 90 segundos..."
            sleep 90
          done
          
          echo "status=retry" >> $GITHUB_OUTPUT

      - name: Re-lanzar workflow inmediatamente si aún no hay capacidad
        if: steps.deploy.outputs.status != 'success'
        run: |
          echo "Esperando 2 minutos de enfriamiento antes de encadenar la siguiente ejecucion..."
          sleep 120
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/hunter.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Siguiente corrida encolada exitosamente."
